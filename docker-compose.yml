version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: polloai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: polloai
      POSTGRES_PASSWORD: polloai
      POSTGRES_DB: polloai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: polloai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: polloai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-mc:
    image: minio/mc:latest
    container_name: polloai-minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/polloai-media || true;
      mc anonymous set public local/polloai-media;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
