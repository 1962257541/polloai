# /docker-compose.yml
services:
  nginx:
    image: nginx:latest
    container_name: doubao-2api-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - doubao-net

  app:
    build:
      context: .
      # Dockerfile.local 依赖本地私有基础镜像 flow2api:headed（本机不存在）；
      # 改用自包含的标准 Dockerfile（python:3.10-slim + 构建期装 Playwright/chromium）。
      dockerfile: Dockerfile
    container_name: doubao-2api-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./.generated:/app/.generated
    networks:
      - doubao-net

networks:
  doubao-net:
    driver: bridge
